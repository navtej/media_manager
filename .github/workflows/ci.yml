name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter:
    name: Flutter checks
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  macos-artifacts:
    name: Build macOS ${{ matrix.mode }} artifact
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - mode: debug
            configuration: Debug
          - mode: release
            configuration: Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Whisper build tools
        if: matrix.mode == 'release'
        run: command -v cmake || brew install cmake

      - name: Prepare bundled Whisper runtime
        if: matrix.mode == 'release'
        run: ./scripts/prepare_whisper_runtime.sh

      - name: Build macOS ${{ matrix.mode }} app
        run: flutter build macos --${{ matrix.mode }}

      - name: Archive macOS ${{ matrix.mode }} app
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/${CONFIGURATION}/Media Manager.app"
          archive_path="dist/MediaManager-macos-${MODE}.zip"

          test -d "$app_path"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"

      - name: Upload macOS ${{ matrix.mode }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.mode }}
          path: dist/MediaManager-macos-${{ matrix.mode }}.zip
