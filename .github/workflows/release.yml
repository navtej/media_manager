name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without creating a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build macOS ARM64 release
    runs-on: macos-26

    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must be dispatched from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packaging tools
        run: brew install cmake create-dmg

      - name: Calculate CalVer release version
        id: version
        run: ./scripts/calculate_release_version.sh

      - name: Build release DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
          ARTIFACT_NAME: ${{ steps.version.outputs.ARTIFACT_NAME }}
        run: ./scripts/build_release.sh

      - name: Generate checksum
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.ARTIFACT_NAME }}
        run: shasum -a 256 "dist/${ARTIFACT_NAME}" > "dist/${ARTIFACT_NAME}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.TAG }}
          path: |
            dist/${{ steps.version.outputs.ARTIFACT_NAME }}
            dist/${{ steps.version.outputs.ARTIFACT_NAME }}.sha256

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
          ARTIFACT_NAME: ${{ steps.version.outputs.ARTIFACT_NAME }}
        run: |
          gh release create "$TAG" \
            "dist/${ARTIFACT_NAME}" \
            "dist/${ARTIFACT_NAME}.sha256" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$TAG"

      - name: Check out Homebrew tap
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: navtej/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.TAP_ACCESS_PAT }}
          fetch-depth: 1

      - name: Update Homebrew cask
        if: ${{ !inputs.dry_run }}
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.ARTIFACT_NAME }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          cask_path="homebrew-tap/Casks/media-manager.rb"
          checksum="$(cut -d' ' -f1 "dist/${ARTIFACT_NAME}.sha256")"

          sed -i '' \
            -e "s/^  version \".*\"$/  version \"${RELEASE_VERSION}\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"${checksum}\"/" \
            "$cask_path"

          grep -Fq "  version \"${RELEASE_VERSION}\"" "$cask_path"
          grep -Fq "  sha256 \"${checksum}\"" "$cask_path"

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/media-manager.rb
          git -C homebrew-tap commit -m "Update Media Manager to ${RELEASE_VERSION}"
          git -C homebrew-tap push origin HEAD:main
